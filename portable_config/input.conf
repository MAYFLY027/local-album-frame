ESC quit
SPACE cycle pause
RIGHT playlist-next
LEFT playlist-prev
MBTN_RIGHT script-binding frame_ui/toggle-toolbar
WHEEL_UP playlist-prev
WHEEL_DOWN playlist-next
f cycle fullscreen
m cycle mute
r playlist-shuffle
s script-binding frame_ui/settings
c script-binding album_clock/toggle-clock
Ctrl+WHEEL_UP add video-zoom 0.1
Ctrl+WHEEL_DOWN add video-zoom -0.1
0 set video-zoom 0; set video-pan-x 0; set video-pan-y 0
